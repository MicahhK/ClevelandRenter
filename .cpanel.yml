---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/arpefwmy/public_html/
    - /bin/rsync -av --exclude='.git' --exclude='config.php' --exclude='.cpanel.yml' --exclude='tools' /home2/arpefwmy/clevelandrenter/ $DEPLOYPATH
    - /bin/chmod 755 /home2/arpefwmy/public_html/
    - /bin/find /home2/arpefwmy/public_html/ -type d -exec /bin/chmod 755 {} \;
    - /bin/find /home2/arpefwmy/public_html/ -type f -exec /bin/chmod 644 {} \;
